async function demo(){
  const LS='bn_demo_v1';let D=JSON.parse(localStorage.getItem(LS)||'null');const sv=()=>localStorage.setItem(LS,JSON.stringify(D));

  const mv=d=>{for(const id in d)D.stock.find(x=>x.id===id).qty-=d[id]};
  return{
    async init(){return D.users.find(u=>u.id===sessionStorage.bn_sess)||null},
    async login(e,p){const u=D.users.find(x=>x.email===e&&x.pw===p);if(!u)throw Error('بيانات الدخول غير صحيحة');if(!u.active)throw Error('الحساب موقوف');sessionStorage.bn_sess=u.id;return u},

    async addUser(u){if(D.users.some(x=>x.email===u.email))throw Error('البريد موجود');D.users.push({...u,id:'u'+Date.now(),active:true});sv()},
    async setUser(id,p){Object.assign(D.users.find(u=>u.id===id),p);sv()},
    cbs:[],async event(ev){D.events=D.events||[];D.events.unshift({id:'e'+Date.now()+Math.random(),...ev});sv();this.cbs.forEach(c=>c.events(D.events.slice(0,15),false))},
    async setNext(n){D.next=n;sv();this.cbs.forEach(c=>c.counter(n))},
    listen(cb){this.cbs.push(cb);cb.events((D.events||[]).slice(0,15),true);cb.counter(D.next);return()=>{this.cbs=this.cbs.filter(x=>x!==cb)}},
    async save(v,old){let rem;if(!old){if(v.no){rem=D.vouchers.find(x=>x.no===v.no);if(rem&&rem.status!=='cancelled')throw Error('الرقم '+v.no+' مستخدم بورقة فعّالة. ألغِها أولاً ثم أعد استخدام الرقم')}else{let n=D.next;while(D.vouchers.some(x=>x.no===n))n++;v.no=n}v.id='v'+v.no}
      const d=deltas(v,old);chk(d);mv(d);if(old)Object.assign(D.vouchers.find(x=>x.id===old.id),v);else{if(rem)D.vouchers=D.vouchers.filter(x=>x!==rem);D.vouchers.push(v);D.next=v.no+1}sv();return v},
    async removeCancelled(ids){D.vouchers=D.vouchers.filter(v=>!(ids.includes(v.id)&&v.status==='cancelled'));sv()},
    async cancel(v,x){mv(deltas(null,v));Object.assign(D.vouchers.find(y=>y.id===v.id),{status:'cancelled',...x});sv()},
    async tsGet(p){return D.ts?.[p]||null},async tsSet(p,x){D.ts=D.ts||{};D.ts[p]=x;sv()},async dayGet(k){return D.tsd?.[k]||null},
    async dayMerge(k,x){D.tsd=D.tsd||{};const mg=(a,b)=>{for(const q in b){if(b[q]===null)delete a[q];else if(typeof b[q]=='object')mg(a[q]=a[q]||{},b[q]);else a[q]=b[q]}};mg(D.tsd[k]=D.tsd[k]||{},x);sv()},
    async dayRange(a,b){return Object.entries(D.tsd||{}).filter(([k])=>k>=a&&k<=b).map(([k,v])=>({id:k,...v}))},
    async patch(v,p){Object.assign(D.vouchers.find(x=>x.id===v.id),p);sv()},
    async stages(v){Object.assign(D.vouchers.find(x=>x.id===v.id),{stages:v.stages,status:v.status});sv()},
    async setNames(v){Object.assign(D.vouchers.find(x=>x.id===v.id),{teamEngN:v.teamEngN,teamDutyN:v.teamDutyN});sv()},
    async setQty(id,q){D.stock.find(s=>s.id===id).qty=q;sv()},
    async seed(){throw Error('الاستيراد متاح فقط بعد ربط Firebase')}}
}
async function fire(){
  const V='https://www.gstatic.com/firebasejs/10.12.2/';

  const rows=async n=>(await F.getDocs(c(n))).docs.map(x=>({id:x.id,...x.data()}));

    if(!s.exists()){if((await F.getDoc(d('meta','init'))).exists())throw Error('حسابك غير مفعّل، راجع المسؤول');
      const p={email:u.email,name:u.email.split('@')[0],role:'admin',canIssue:true,active:true};await F.setDoc(d('users',u.uid),p);await F.setDoc(d('meta','init'),{at:Date.now()});await F.setDoc(d('meta','counter'),{next:149});return{id:u.uid,...p}}
    const p=s.data();if(!p.active)throw Error('الحساب موقوف');return{id:u.uid,...p}}
  const tx=(v,old,cancel,extra)=>F.runTransaction(db,async t=>{
    const dl=cancel?deltas(null,v):deltas(v,old),ids=Object.keys(dl),sn=await Promise.all(ids.map(i=>t.get(d('stock',i))));let cs,vr,nx=149;
    if(!cancel&&!old){cs=await t.get(d('meta','counter'));nx=cs.exists()?cs.data().next:149;if(v.no){vr=d('vouchers','v'+v.no);const e=await t.get(vr);if(e.exists()&&e.data().status!=='cancelled')throw Error('الرقم '+v.no+' مستخدم بورقة فعّالة. ألغِها أولاً ثم أعد استخدام الرقم')}
      else{for(let k=0;k<50;k++){vr=d('vouchers','v'+nx);if(!(await t.get(vr)).exists())break;nx++}v.no=nx}
      v.id='v'+v.no}
    sn.forEach((s,k)=>{if(!s.exists())throw Error('المادة غير موجودة بالمخزن، أعد الاستيراد');if(s.data().qty-dl[ids[k]]<0)throw Error('الكمية غير كافية: '+s.data().desc);t.update(s.ref,{qty:s.data().qty-dl[ids[k]]})});
    if(cancel)t.update(d('vouchers',v.id),{status:'cancelled',...(extra||{})});else if(old)t.update(d('vouchers',old.id),v);else{t.set(vr,v);t.set(d('meta','counter'),{next:v.no+1})}});

    init:()=>new Promise(r=>A.onAuthStateChanged(au,u=>r(u?prof(u).catch(()=>null):null))),
    login:async(e,p)=>prof((await A.signInWithEmailAndPassword(au,e,p)).user),logout:()=>A.signOut(au),
    async all(f={}){const o={},J=[];

      if(f.next)J.push(F.getDoc(d('meta','counter')).then(s=>{o.next=s.exists()?s.data().next:149}));
      if(f.stock)J.push(rows('stock').then(r=>{o.stock=r}));
      if(f.users)J.push(rows('users').then(r=>{o.users=r}).catch(()=>{o.users=[]}));
      if(f.gens){const g=localStorage.bn_gens;if(g&&Date.now()-(+localStorage.bn_gens_t||0)<6048e5)o.gens=JSON.parse(g);else J.push(rows('gens').then(gl=>{const m={};gl.forEach(x=>{const{id,...r}=x;m[id]=r});o.gens=m;try{localStorage.bn_gens=JSON.stringify(m);localStorage.bn_gens_t=Date.now()}catch{}}))}
      await Promise.all(J);return o},
    async addUser(u){const a2=A.getAuth(initializeApp(cfg,'s'+Date.now()));let r;
      try{r=await A.createUserWithEmailAndPassword(a2,u.email,u.pw)}catch(e){if(e.code!=='auth/email-already-in-use')throw Error(e.code||e.message);
        try{r=await A.signInWithEmailAndPassword(a2,u.email,u.pw)}catch{throw Error('الإيميل مسجل بكلمة مرور مختلفة. احذفه من Authentication ثم أضفه من جديد')}}
      await A.signOut(a2);if((await F.getDoc(d('users',r.user.uid))).exists())throw Error('المستخدم موجود مسبقاً بالقائمة');delete u.pw;await F.setDoc(d('users',r.user.uid),{...u,active:true})},
    setUser:(id,p)=>F.updateDoc(d('users',id),p),
    event:ev=>F.addDoc(c('events'),ev),
    async removeCancelled(ids){const b=F.writeBatch(db);ids.forEach(i=>b.delete(d('vouchers',i)));await b.commit()},
    setNext:n=>F.setDoc(d('meta','counter'),{next:n}),
    listen(cb){const u1=F.onSnapshot(d('meta','counter'),s=>{if(s.exists())cb.counter(s.data().next)},()=>{});let first=true;
      const u2=F.onSnapshot(F.query(c('events'),F.orderBy('at','desc'),F.limit(15)),s=>{cb.events(s.docs.map(x=>({id:x.id,...x.data()})),first);first=false},()=>{});return()=>{u1();u2()}},
    async save(v,old){await tx(v,old);return v},cancel:(v,x)=>tx(v,null,true,x),patch:(v,p)=>F.updateDoc(d('vouchers',v.id),p),
    tsGet:async p=>{const s=await F.getDoc(d('ts',p));return s.exists()?s.data():null},tsSet:(p,x)=>F.setDoc(d('ts',p),x),
    dayGet:async k=>{const s=await F.getDoc(d('ts_days',k));return s.exists()?s.data():null},

    dayRange:async(a,b)=>(await F.getDocs(F.query(c('ts_days'),F.where(F.documentId(),'>=',a),F.where(F.documentId(),'<=',b)))).docs.map(x=>({id:x.id,...x.data()})),stages:v=>F.updateDoc(d('vouchers',v.id),{stages:v.stages,status:v.status}),setNames:v=>F.updateDoc(d('vouchers',v.id),{teamEngN:v.teamEngN,teamDutyN:v.teamDutyN}),setQty:(id,q)=>F.updateDoc(d('stock',id),{qty:q}),
    async seed(){if((await rows('stock')).length&&!confirm('المخزن فيه بيانات! الاستيراد يستبدل الكميات. متأكد؟'))return;
      const st=await(await fetch('stock.json')).json(),g=await(await fetch('gens.json')).json();const ops=[...st.map((s,i)=>[d('stock','s'+i),s]),...Object.entries(g).map(([k,v])=>[d('gens',k),v])];

const evText=e=>({issue:`🆕 ${e.name} صرف ورقة رقم ${e.no} (${TYPES[e.vt]?.n||''}) ${e.gen||''}`,edit:`✏️ ${e.name} عدّل ورقة رقم ${e.no}`,cancel:`❌ ${e.name} ألغى ورقة رقم ${e.no}`,sign:`✅ ${e.name} وقّع مرحلة (${ROLES[e.role]||''}) على ورقة ${e.no}`,counter:`🔢 ${e.name} غيّر رقم الصادر القادم إلى ${e.n}`,reset:`🗑 ${e.name} حذف ${e.n} ورقة ملغاة`,request:`📨 ${e.name} أرسل ورقة رقم ${e.no} (${TYPES[e.vt]?.n||''}) لموافقة مناوب الورشة${e.rcv?' (المستلم: '+e.rcv+')':''}`,approve:`✅ ${e.name} وافق على ورقة رقم ${e.no} — يمكن طباعتها الآن`,complete:`🏁 ${e.name} أتمّ صرف ورقة رقم ${e.no} نهائياً`,reopen:`🔓 ${e.name} أعاد فتح ورقة رقم ${e.no}`,reject:`⛔ ${e.name} (مناوب الورشة) رفض ورقة رقم ${e.no}${e.reason?' — '+e.reason:''}`}[e.t]||'');
const seenKey=()=>'bn_seen_'+S.user.id,unread=()=>S.ev.filter(e=>e.by!==S.user.id&&e.at>(+localStorage[seenKey()]||0)).length;
const bellUpd=()=>{const b=$('#bell');if(b){const n=unread();b.textContent='🔔'+(n?' '+n:'');b.className=n?'r':'w'}};
function onEv(arr,first){const old=new Set(S.ev.map(e=>e.id));S.ev=arr;if(!first)arr.filter(e=>!old.has(e.id)&&e.by!==S.user.id).forEach(e=>{const t=evText(e);toast(t);try{if(document.hidden&&Notification.permission=='granted')new Notification('نظام الصرف',{body:t})}catch{}});bellUpd()}
function onCounter(n){S.data.next=n;const x=$('#nextNo');if(x)x.textContent=n;if(FM&&!FM.old&&!FM.noEdited){FM.v.no=FM.autoNo=n;const f=$('#f_no');if(f)f.value=n}}
async function ev(t,x={}){try{await B.event({t,by:S.user.id,name:S.user.name,at:Date.now(),...x})}catch{}}
let idle;const bump=()=>{clearTimeout(idle);if(S.user)idle=setTimeout(async()=>{await A.logout();toast('تم تسجيل الخروج لعدم النشاط')},36e5)};document.addEventListener('mousedown',e=>{if(!e.target.closest('#sres')&&!e.target.matches('input[data-s]'))$('#sres').style.display='none'});
['click','keydown','mousemove','touchstart'].forEach(e=>addEventListener(e,bump,{passive:true}));
const localStock=d=>{for(const id in d){const s=S.data.stock.find(x=>x.id===id);if(s)s.qty-=d[id]}};

  <nav>${S.hist.length&&S.tab!='home'?'<button class=w onclick="A.back()">↩ رجوع</button>':''}${T.map(([k,n])=>`<button class="${S.tab==k?'on':''}" onclick="A.go('${k}')">${n}</button>`).join('')}${FM&&S.tab!='form'?`<button class=g onclick="A.resume()">📝 ورقة قيد التحرير${FM.old?' (تعديل '+FM.old.no+')':''}</button>`:''}</nav><main>${body}</main>`;tilt();bellUpd()}

  (canIssue()?`<div class=cards>${Object.entries(TYPES).map(([k,t])=>`<div class=c3 style="background:linear-gradient(145deg,${t.c})" onclick="A.newV('${k}')"><i>${t.i}</i><b>${t.n}</b></div>`).join('')}</div>`:'<p style="text-align:center">لا تملك صلاحية الصرف. يمكنك متابعة الأوراق وتوقيع مرحلتك من تبويب المتابعة.</p>')}

function log(){const q=(S.q||'').toLowerCase(),v=S.data.vouchers.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
  return`<div class=box>${isAdm()&&v.some(x=>x.status=='cancelled')?`<p><button class=r onclick="A.purge()">🗑 تصفير كل الأوراق الملغاة (${S.data.vouchers.filter(x=>x.status=='cancelled').length})</button> <small>يحذف الملغاة فقط ويحرّر أرقامها لإعادة الاستخدام</small></p>`:''}<input placeholder="🔍 بحث برقم الصادر / المولد / البئر / المادة..." value="${esc(S.q||'')}" oninput="S.q=this.value;A.go('log',1)" id=sq><table><tr><th>الرقم<th>النوع<th>التاريخ<th>Gen<th>بئر/تيم/جهة<th>مواد<th>الحالة<th></tr>${v.map(x=>`<tr><td><b>${x.no}</b><td>${TYPES[x.type].n}<td>${fd(x.date)}<td>${esc(x.gen)}<td>${esc(x.well||x.subject||x.maint||'')}<td style="text-align:right;font-size:12px">${x.items.map(i=>esc(i.desc)+'×'+i.qty).join('، ')}<td><span class="tag ${x.status=='cancelled'?'c':''}" style="${x.status=='pending'?'background:#e08a1e':x.status=='completed'?'background:#0d2b4e':''}">${x.status=='cancelled'?'ملغاة'+(x.rejected?' — رفض '+esc(x.rejected.by)+(x.rejected.reason?': '+esc(x.rejected.reason):''):''):x.status=='pending'?'بانتظار الموافقة':x.status=='completed'?'مكتملة 🔒':'فعّالة'}</span><td>${x.status=='pending'&&!['admin','wsDuty'].includes(S.user.role)?'<span class=tag style="background:#e08a1e">⏳ بانتظار موافقة مناوب الورشة</span>':`<button onclick="A.view('${x.id}')">${x.status=='pending'?'👁 معاينة':'🖨️ عرض/طباعة'}</button>`}${canEditV()&&!['cancelled','completed'].includes(x.status)?` <button class=g onclick="A.edit('${x.id}')">تعديل</button>`:''}${isAdm()&&!['cancelled','completed'].includes(x.status)?` <button class=r onclick="A.cancel('${x.id}')">إلغاء</button>`:''}${isAdm()&&x.status=='cancelled'?` <button class=r onclick="A.purge('${x.id}')">🗑 حذف</button>`:''}${['admin','wsDuty'].includes(S.user.role)&&x.status=='active'?` <button class=g onclick="A.complete('${x.id}')">✅ إتمام نهائي</button>`:''}${isAdm()&&x.status=='completed'?` <button class=w onclick="A.reopen('${x.id}')">🔓 إعادة فتح</button>`:''}</tr>`).join('')}</table></div>`}
const completeBox=x=>x.status=='completed'?`<p>🔒 <b>مكتملة نهائياً</b> — ${esc(x.completedBy||'')} · ${x.completedAt?new Date(x.completedAt).toLocaleString('ar-IQ'):''}${isAdm()?` <button class=w onclick="A.reopen('${x.id}')">🔓 إعادة فتح</button>`:''}</p>`:x.status=='active'&&['admin','wsDuty'].includes(S.user.role)?`<p><button class=g onclick="A.complete('${x.id}')">✅ إتمام الصرف نهائياً</button> <small>بعد الطباعة. لا تقبل الورقة التعديل بعدها</small></p>`:'';
function track(){const v=S.data.vouchers.filter(x=>x.status!=='cancelled'),p=x=>x.status!=='completed',list=S.pend?v.filter(p):v;
  return`<div class=box style="padding:10px"><button class="${S.pend?'':'w'}" onclick="S.pend=true;A.go('track',0,1)">قيد المتابعة (${v.filter(p).length})</button> <button class="${S.pend?'w':''}" onclick="S.pend=false;A.go('track',0,1)">كل الأوراق (${v.length})</button> <button class=w onclick="A.go('track',0,1)">🔄 تحديث</button></div>`+
  list.map(x=>{const cur=x.stages.findIndex(s=>!s.done),pct=Math.round(x.stages.filter(s=>s.done).length/x.stages.length*100),last=x.stages.filter(s=>s.done).length-1;
    return`<div class=box><b>ورقة ${x.no}</b> · ${TYPES[x.type].n} · ${esc(x.gen)} ${esc(x.well)} · ${fd(x.date)} <span class="tag ${cur<0?'':'c'}" style="${cur<0?'':'background:#e08a1e'}">${x.status=='completed'?'مكتملة نهائياً 🔒':cur<0?'معتمدة ✅ بانتظار الإتمام النهائي':'الآن عند: '+ROLES[x.stages[cur].k]}</span> <span class=tag>${pct}%</span><div style="font-size:13px;margin-top:6px">📦 ${x.items.map(i=>esc(i.desc)+' × '+i.qty).join(' ، ')}</div>${x.type=='wells'?`<div style="font-size:13px;margin-top:4px">👷 المستلم — مهندس التيم: <b>${esc(x.teamEngN||'—')}</b> · مناوب التيم: <b>${esc(x.teamDutyN||'—')}</b> ${x.status!='completed'&&(isAdm()||canIssue()||S.user.role=='wsEng')?`<a href=# onclick="A.names('${x.id}');return false">✎ تعديل الأسماء</a>`:''}</div>`:''}<div class=chain>${x.stages.map((s,i)=>`<div class="st ${s.done?'ok':i==cur?'cur':''}">${s.done?'✅':i==cur?'⏳':'⚪'} ${ROLES[s.k]}<br><small>${s.done?esc(s.by)+' · '+new Date(s.at).toLocaleString('ar-IQ'):i==cur?'بانتظار التوقيع':''}</small>${S.user.role=='wsDuty'&&s.k=='wsDuty'&&!s.done?`<br><button class=r onclick="A.reject('${x.id}')">❌ رفض</button>`:''}${A.can(x,i)?`<br><button class=g onclick="A.sign('${x.id}',${i})">${s.k=='wsDuty'?(x.status=='pending'?'✔ موافقة وتوقيع':'✔ تم'):'توقيع'}</button>`:''}${s.done&&i==last&&isAdm()?`<br><button class=w onclick="A.unsign('${x.id}',${i})">تراجع</button>`:''}</div>${i<x.stages.length-1?'←':''}`).join('')}</div>${completeBox(x)}</div>`}).join('')||'<div class=box>لا توجد أوراق</div>'}

async function dataUri(u){const b=await(await fetch(u)).blob();return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
function pdfFrom(urls,w,h){const enc=new TextEncoder(),parts=[],offs=[],n=urls.length;let off=0;const push=x=>{const u=typeof x=='string'?enc.encode(x):x;parts.push(u);off+=u.length};
  const bytes=urls.map(u=>Uint8Array.from(atob(u.split(',')[1]),c=>c.charCodeAt(0))),ob=(id,b)=>{offs[id]=off;push(id+' 0 obj\n'+b+'\nendobj\n')},cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
  push('%PDF-1.4\n');ob(1,'<</Type/Catalog/Pages 2 0 R>>');ob(2,'<</Type/Pages/Kids['+urls.map((_,k)=>(3+3*k)+' 0 R').join(' ')+']/Count '+n+'>>');
  urls.forEach((_,k)=>{const p=3+3*k;ob(p,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>');ob(p+1,'<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream');
    offs[p+2]=off;push((p+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+w+'/Height '+h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+bytes[k].length+'>>\nstream\n');push(bytes[k]);push('\nendstream\nendobj\n')});
  const tot=3+3*n,xr=off;let x='xref\n0 '+tot+'\n0000000000 65535 f \n';for(let i=1;i<tot;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<</Size '+tot+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}
async function sheetPdf(el){const W=794,PH=1123,css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n').replace(/@media print[\s\S]*$/,''),logo=await dataUri('logo.jpg'),n=Math.max(1,Math.ceil((el.scrollHeight-6)/PH)),H=n*PH;
  const c=el.cloneNode(true);c.querySelectorAll('img').forEach(i=>i.setAttribute('src',logo));c.setAttribute('style','width:'+W+'px;height:'+H+'px;min-height:0;margin:0;box-shadow:none');
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject width="'+W+'" height="'+H+'"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="width:'+W+'px;height:'+H+'px;background:#fff"><style><![CDATA['+css+']]></style>'+new XMLSerializer().serializeToString(c)+'</div></foreignObject></svg>';
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();
  const K=2,cv=document.createElement('canvas');cv.width=W*K;cv.height=H*K;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
  const pg=[];for(let k=0;k<n;k++){const p=document.createElement('canvas');p.width=W*K;p.height=PH*K;p.getContext('2d').drawImage(cv,0,k*PH*K,W*K,PH*K,0,0,W*K,PH*K);pg.push(p.toDataURL('image/jpeg',.92))}
  return pdfFrom(pg,W*K,PH*K)}
